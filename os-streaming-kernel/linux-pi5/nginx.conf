worker_processes auto;
pid /tmp/os_streaming_nginx.pid;
error_log /tmp/os_streaming_nginx_error.log warn;

events {
    use epoll;
    worker_connections 1024;
    multi_accept on;
}

http {
    default_type application/octet-stream;
    access_log off;

    # Kernel zero-copy & TCP optimizations (System 1 OS Tuning)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Cache open file descriptors in Linux VFS / page cache
    open_file_cache max=200 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;

    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        application/vnd.apple.mpegurl         m3u8;
        video/mp2t                            ts;
        video/mp4                             mp4 m4v;
        video/webm                            webm;
        audio/mpeg                            mp3;
        audio/mp4                             m4a aac;
    }

    server {
        listen 8081;
        server_name _;

        root __ROOT_DIR__/www;
        index index.html;

        add_header Access-Control-Allow-Origin * always;
        add_header Accept-Ranges bytes always;

        location / {
            try_files $uri $uri/ =404;
        }

        location /media/ {
            alias __ROOT_DIR__/media/;
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin * always;
        }

        location = /status {
            default_type text/plain;
            return 200 "Linux + Raspberry Pi 5 (Nginx epoll + sendfile + CFS Scheduler)\nport: 8081\n";
        }
    }
}
